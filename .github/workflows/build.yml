# Manual U-Boot build on GitHub's arm64 runner (native gcc): Actions -> u-boot -> Run workflow.
# The artifact holds scripts/build.sh's dist/ (u-boot-iceland-v4.img etc.). Any image is RAM-booted first
# (`fastboot boot`); this workflow writes nothing anywhere.
name: u-boot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev libgnutls28-dev uuid-dev python3-dev \
            python3-setuptools python3-pyelftools swig gzip >/dev/null

      - name: Prepare source (pinned tag + patch queue, tree hashes verified)
        run: scripts/prepare.sh "$RUNNER_TEMP/src"

      - name: Build
        run: CROSS_COMPILE=aarch64-linux-gnu- scripts/build.sh "$RUNNER_TEMP/src" "$RUNNER_TEMP/out"

      - name: Upload build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: iceland-u-boot-${{ github.sha }}
          path: ${{ runner.temp }}/out/dist/
          retention-days: 14
